name: Build YA CLIENT (Fabric 1.21.x)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.mc != '1.21.11' }}   # 1.21.1/1.21.4/1.21.8 are not ported yet
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.1",  loader: "0.16.14", api: "0.116.11+1.21.1" }
          - { mc: "1.21.4",  loader: "0.16.14", api: "0.119.4+1.21.4" }
          - { mc: "1.21.8",  loader: "0.17.2",  api: "0.136.1+1.21.8" }
          - { mc: "1.21.11", loader: "0.18.1",  api: "0.141.1+1.21.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "current"
      - name: Build the jar (with retries)
        working-directory: fabric-legacy
        run: |
          for i in 1 2 3; do
            gradle build --no-daemon -Pmc=${{ matrix.mc }} -Ploader=${{ matrix.loader }} -Papi=${{ matrix.api }} && exit 0
            echo "Build failed (try $i), retrying in 45s..."
            sleep 45
          done
          exit 1
      - name: API dump (printed in the log)
        if: always()
        working-directory: fabric-legacy
        run: |
          JARS=$( (find ~/.gradle -name "*.jar" | grep -iE "minecraft.*(merged|client|mojang)|minecraft-merged|net.minecraft" | grep -vi "sources" | head -30; find ~/.gradle/caches/modules-2 -name "fabric-*.jar" | grep -vi "sources" | head -80) )
          echo "== jars =="; echo "$JARS"
          CP=$(echo "$JARS" | tr '\n' ':')
          while read -r c; do
            [ -z "$c" ] && continue
            echo "##### $c"; javap -public -cp "$CP" "$c" 2>&1 | head -300
          done < tools/api-classes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YAClient-fabric-${{ matrix.mc }}
          path: fabric-legacy/build/libs/yaclient-fabric-${{ matrix.mc }}.jar
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fabric-legacy/build/libs/yaclient-fabric-${{ matrix.mc }}.jar
