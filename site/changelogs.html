<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Changelogs - YA CLIENT</title><meta name="description" content="Every YA CLIENT update.">
<link rel="icon" href="/px/favicon.png"><link rel="stylesheet" href="/px.css"></head><body>

<section><div class="wrap">
  <div class="stitle"><h1>Changelogs</h1><p>Every update, newest first. The launcher installs them for you.</p></div>
  <div class="tl" id="tl"></div>
</div></section>
<script src="/px-config.js"></script><script src="/px.js"></script>
<script>
loadData("changelog").then(c=>{document.getElementById("tl").innerHTML=c.map(x=>`<div class="item reveal"><div class="px card"><div class="meta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${x.tag?`<span class="tag">${esc(x.tag)}</span>`:""}<span class="ver">${esc(x.version)}</span><span class="when">${esc(x.date||"")}</span></div><h3 style="margin-top:8px">${esc(x.title||"")}</h3><ul class="chg">${(x.changes||[]).map(c=>`<li><span class="b ${esc(c.t)}">${esc(c.t)}</span><span>${esc(c.text)}</span></li>`).join("")}</ul></div></div>`).join("")||'<p class="sub">Nothing here yet.</p>';reveal()});
</script>
</body></html>
