 var title=ids.length===4&&ids.every(function(i){return P[i].set===P[ids[0]].set})?SETS[P[ids[0]].set].n:(ids.length===1?P[ids[0]].n:'Custom cosmetics');
 return {title:title,lines:ids.map(function(i){return P[i].n+' · '+(priceOf(i)?eur(priceOf(i)):'Free')}).concat(m===4?['Bundle discount applied']:[],window.YAplusOn?['YA Plus -50% applied ('+window.YAplusName+')']:[]),total:t,ids:ids.join(',')}}
document.addEventListener('yaplus',function(e){var b=document.getElementById('plusbar2');if(b){b.className='plusbar'+(e.detail&&e.detail.on?' on':'');b.querySelector('span').textContent=e.detail&&e.detail.on?'YA Plus active for '+e.detail.name+': -70% on everything, already applied below.':'Enter your Minecraft name under the 3D character to check your YA Plus discount.'}render()});
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-buy],[data-c],[data-rm],.pc,#getw,#clr');if(!t)return;
 if(t.dataset.c){cat=t.dataset.c;render();return}
 if(t.dataset.rm){worn=worn.filter(function(x){return x!==t.dataset.rm});render();return}
 if(t.id==='clr'){worn=[];render();return}
 if(t.id==='getw'){if(worn.length)YABuy(orderFor(worn));return}
 if(t.dataset.buy){e.stopPropagation();var k=t.dataset.buy,ids=t.dataset.s==='1'?SETS[k].items:[k];YABuy(orderFor(ids));return}
 if(t.classList.contains('pc')){var k2=t.dataset.k;if(t.dataset.s!=='1'){location.href='/item?i='+k2;return}if(t.dataset.s==='1'&&PAGES.indexOf(k2)>=0){location.href='/bundle?b='+k2;return}if(t.dataset.s==='1'){var its=SETS[k2].items,all=its.every(function(i){return worn.indexOf(i)>=0});worn=all?[]:its.slice()}else toggle(k2);render()}
});
render();
})();
</script></body></html>
