<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>YA CLIENT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="style2.css"></head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="app">
  <aside class="rail">
    <div class="brandbox" id="brand"><img class="mark" src="../assets/logo.png" alt="YA"></div>
    <nav id="nav"></nav>
    <div class="rail-end"><button class="nav" id="btnAcc"><span id="accIcon"></span><em id="accLbl"></em></button></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="brand" id="ver"></div>
      <button class="searchpill" id="openPal" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span id="palLbl">Search</span><kbd>Ctrl K</kbd></button>
      <div class="top-r"><button class="accpill" id="accPill"></button>
        <button class="wb" data-w="min" aria-label="Minimize">&#8211;</button><button class="wb" data-w="max" aria-label="Maximize">&#9633;</button><button class="wb x" data-w="close" aria-label="Close">&#10005;</button></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="ob" class="ob" hidden></div>
<div id="wz" class="wz" hidden></div>
<div id="pal" class="pal" hidden></div>
<div id="toasts" class="toasts"></div>
<script src="modicons.js"></script><script src="app.js"></script>
</body></html>
